<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet & Withdrawal - Secure App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .balance-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #475569;
        }
        .balance-box h3 {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
        }
        .balance-box p {
            margin: 8px 0 0 0;
            font-size: 24px;
            font-weight: bold;
            color: #4ade80;
        }
        .input-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #0284c7, #9333ea);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-logout {
            background: #f43f5e;
            margin-top: 15px;
        }
        .error-msg {
            color: #f43f5e;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
        }
        .success-msg {
            color: #4ade80;
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>My Wallet</h2>
        
        <div class="balance-box">
            <h3>Available Balance</h3>
            <p id="user-balance">₹0</p>
        </div>

        <h3>Withdraw Funds</h3>
        <div class="input-group">
            <label>Amount (₹)</label>
            <input type="number" id="withdraw-amount" placeholder="Enter amount to withdraw">
        </div>

        <div class="input-group">
            <label>UPI ID (For Receiving Money)</label>
            <input type="text" id="withdraw-upi" placeholder="e.g. username@ybl">
        </div>

        <div class="input-group">
            <label>Login Password (Security Check)</label>
            <input type="password" id="withdraw-password" placeholder="Enter your password">
        </div>

        <button class="btn" onclick="requestWithdrawal()">Submit Withdrawal Request</button>
        
        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>

        <button class="btn btn-logout" onclick="logout()">Log Out</button>
    </div>

    <script>
        // Check current logged in user safely
        let currentMobile = localStorage.getItem('current_user');
        
        // Fallback testing support: agar direct khola hai aur user nahi hai, toh ek dummy user set kar lo taaki page crash na ho
        if (!currentMobile) {
            currentMobile = "9999999999";
            let dummyUser = {
                mobile: currentMobile,
                password: "123",
                balance: 500
            };
            localStorage.setItem('user_' + currentMobile, JSON.stringify(dummyUser));
            localStorage.setItem('current_user', currentMobile);
        }

        // Load User Data & Balance
        function loadUserData() {
            const savedData = localStorage.getItem('user_' + currentMobile);
            if (savedData) {
                const userData = JSON.parse(savedData);
                document.getElementById('user-balance').innerText = '₹' + (userData.balance || 0);
            } else {
                document.getElementById('user-balance').innerText = '₹0';
            }
        }
        loadUserData();

        // Withdrawal Request Function with Admin Integration
        function requestWithdrawal() {
            const amountInput = document.getElementById('withdraw-amount').value;
            const upiInput = document.getElementById('withdraw-upi').value;
            const passwordInput = document.getElementById('withdraw-password').value;
            
            const errorEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');
            
            errorEl.innerText = '';
            successEl.innerText = '';

            const amount = parseFloat(amountInput);
            if (!amount || amount <= 0) {
                errorEl.innerText = 'Please enter a valid withdrawal amount.';
                return;
            }
            if (!upiInput) {
                errorEl.innerText = 'Please enter a valid UPI ID.';
                return;
            }
            if (!passwordInput) {
                errorEl.innerText = 'Please enter your password.';
                return;
            }

            // Verify User & Password
            let userData = JSON.parse(localStorage.getItem('user_' + currentMobile));
            if (!userData || userData.password !== passwordInput) {
                errorEl.innerText = 'Incorrect password! Please try again.';
                return;
            }

            // Check Balance
            if (userData.balance < amount) {
                errorEl.innerText = 'Insufficient balance in your wallet!';
                return;
            }

            // Deduct balance from user account
            userData.balance -= amount;
            localStorage.setItem('user_' + currentMobile, JSON.stringify(userData));
            loadUserData();

            // Send Request to Admin Panel (`withdrawal_requests`)
            let requests = JSON.parse(localStorage.getItem('withdrawal_requests')) || [];
            const newRequest = {
                mobile: currentMobile,
                amount: amount,
                upi: upiInput,
                time: new Date().toLocaleString()
            };
            requests.push(newRequest);
            localStorage.setItem('withdrawal_requests', JSON.stringify(requests));

            // Success message
            successEl.innerText = 'Withdrawal request submitted successfully! Admin will process it soon.';
            document.getElementById('withdraw-amount').value = '';
            document.getElementById('withdraw-upi').value = '';
            document.getElementById('withdraw-password').value = '';
        }

        // Strict Logout Function (Only runs when Logout button is clicked)
        function logout() {
            localStorage.removeItem('current_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
