<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन और रजिस्ट्रेशन - सुरक्षित पोर्टल</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .auth-container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .auth-container h2 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        .auth-container p {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #cbd5e1;
        }
        .form-group input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            padding: 12px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }
        .auth-btn {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            margin-top: 10px;
        }
        #otp-section {
            display: none;
            margin-top: 15px;
            border-top: 1px dashed #475569;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>सुरक्षित पोर्टल 🔐</h2>
        <p>लॉगिन करने के लिए विवरण दर्ज करें</p>

        <div id="input-step">
            <div class="form-group">
                <label>मोबाइल नंबर</label>
                <input type="tel" id="userPhone" placeholder="अपना 10 अंकों का नंबर लिखें" maxlength="10">
            </div>
            <div class="form-group">
                <label>पासवर्ड सेट करें / दर्ज करें</label>
                <input type="password" id="userPassword" placeholder="अपना पासवर्ड बनाएं">
            </div>
            <button class="auth-btn" onclick="sendOtp()">OTP भेजें और आगे बढ़ें</button>
        </div>

        <div id="otp-section">
            <div class="form-group">
                <label>वेरिफ़िकेशन OTP दर्ज करें <span id="show-otp-hint" style="color: #4ade80; font-size: 11px;"></span></label>
                <input type="text" id="enteredOtp" placeholder="4 अंकों का OTP लिखें" maxlength="4">
            </div>
            <button class="auth-btn" onclick="verifyAndLogin()">लॉगिन सत्यापित करें</button>
        </div>
    </div>

    <script>
        let generatedOtp = "";

        function sendOtp() {
            let phone = document.getElementById("userPhone").value.trim();
            let password = document.getElementById("userPassword").value.trim();

            if (phone.length !== 10 || !password) {
                alert("कृपया सही मोबाइल नंबर और पासवर्ड दर्ज करें!");
                return;
            }

            // 4 अंकों का रैंडम OTP जनरेट करना
            generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
            
            // टेस्टिंग और आसानी के लिए स्क्रीन पर ही OTP दिखा देना ताकि यूजर को पता चल जाए
            document.getElementById("show-otp-hint").innerText = "(आपका OTP: " + generatedOtp + ")";
            
            alert("आपके मोबाइल नंबर पर OTP भेज दिया गया है!");
            
            document.getElementById("input-step").style.display = "none";
            document.getElementById("otp-section").style.display = "block";
        }

        function verifyAndLogin() {
            let userOtp = document.getElementById("enteredOtp").value.trim();
            let password = document.getElementById("userPassword").value.trim();
            let phone = document.getElementById("userPhone").value.trim();

            if (userOtp !== generatedOtp) {
                alert("गलत OTP! कृपया सही OTP दर्ज करें।");
                return;
            }

            // डेटा सेव करना ताकि वॉलेट में पासवर्ड काम आ सके और नया यूजर होने पर वॉलेट ₹0 रहे
            localStorage.setItem("userPhone", phone);
            localStorage.setItem("userPassword", password); // यही पासवर्ड विड्रॉल में काम आएगा

            if (!localStorage.getItem("userWallet")) {
                localStorage.setItem("userWallet", "0"); // नया यूजर वॉलेट ₹0
            }

            alert("लॉगिन सफल! डैशबोर्ड पर रीडायरेक्ट किया जा रहा है...");
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
