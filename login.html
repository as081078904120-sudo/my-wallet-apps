<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register with OTP - Earning App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b1120;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #0284c7, #9333ea);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .error-msg {
            color: #f43f5e;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .success-msg {
            color: #4ade80;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
        .login-link a {
            color: #38bdf8;
            text-decoration: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>नया खाता बनाएं (Register)</h2>
        
        <!-- स्टेप 1: मोबाइल और पासवर्ड इनपुट -->
        <div id="step-1">
            <div class="input-group">
                <label>मोबाइल नंबर</label>
                <input type="text" id="reg-mobile" placeholder="अपना मोबाइल नंबर दर्ज करें">
            </div>

            <div class="input-group">
                <label>पासवर्ड</label>
                <input type="password" id="reg-password" placeholder="अपना पासवर्ड दर्ज करें">
            </div>

            <button class="btn" onclick="sendOtp()">ओटीपी भेजें (Send OTP)</button>
        </div>

        <!-- स्टेप 2: ओटीपी वेरिफिकेशन इनपुट (शुरु में छिपा रहेगा) -->
        <div id="step-2" class="hidden">
            <div class="input-group">
                <label>ओटीपी दर्ज करें (Enter OTP)</label>
                <input type="text" id="entered-otp" placeholder="4 अंकों का ओटीपी लिखें">
            </div>

            <button class="btn" onclick="verifyAndRegister()">सत्यापित करें और रजिस्टर करें</button>
        </div>
        
        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>

        <div class="login-link">
            पहले से खाता है? <a href="index.html">लॉगिन करें</a>
        </div>
    </div>

    <script>
        let generatedOtpCode = '';
        let tempMobile = '';
        let tempPassword = '';

        // रैंडम 4 अंकों का ओटीपी जनरेट करने का फंक्शन (हर बार नया आएगा)
        function generateRandomOtp() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        // स्टेप 1: ओटीपी भेजने का फंक्शन
        function sendOtp() {
            const mobile = document.getElementById('reg-mobile').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            
            const errorEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');
            
            errorEl.innerText = '';
            successEl.innerText = '';

            if (!mobile || mobile.length < 10) {
                errorEl.innerText = 'कृपया सही मोबाइल नंबर दर्ज करें!';
                return;
            }
            if (!password) {
                errorEl.innerText = 'कृपया पासवर्ड दर्ज करें!';
                return;
            }

            // चेक करना कि क्या यह नंबर पहले से रजिस्टर्ड है या नहीं
            const existingUser = localStorage.getItem('user_' + mobile);
            if (existingUser) {
                errorEl.innerText = 'यह नंबर पहले से रजिस्टर्ड है (Already Registered)!';
                return;
            }

            // नया रैंडम ओटीपी जनरेट करना
            generatedOtpCode = generateRandomOtp();
            tempMobile = mobile;
            tempPassword = password;

            // स्क्रीन पर ओटीपी दिखाना (ताकि यूजर देखकर टाइप कर सके)
            successEl.innerText = `ओटीपी भेजा गया है। (टेस्ट ओटीपी: ${generatedOtpCode})`;

            // स्टेप 1 छिपाएं और स्टेप 2 (ओटीपी बॉक्स) दिखाएं
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }

        // स्टेप 2: ओटीपी मैच करके फाइनल रजिस्टर करना
        function verifyAndRegister() {
            const userEnteredOtp = document.getElementById('entered-otp').value.trim();
            const errorEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');

            errorEl.innerText = '';
            successEl.innerText = '';

            if (!userEnteredOtp) {
                errorEl.innerText = 'कृपया ओटीपी दर्ज करें!';
                return;
            }

            // चेक करना कि यूजर ने सही ओटीपी डाला है या नहीं
            if (userEnteredOtp !== generatedOtpCode) {
                errorEl.innerText = 'गलत ओटीपी! कृपया सही ओटीपी दर्ज करें।';
                return;
            }

            // अगर ओटीपी सही है, तो यूजर का नया अकाउंट सेव करें
            const newUser = {
                mobile: tempMobile,
                password: tempPassword,
                balance: 0,
                activePlans: []
            };

            localStorage.setItem('user_' + tempMobile, JSON.stringify(newUser));
            localStorage.setItem('current_user', tempMobile);

            successEl.innerText = 'रजिस्ट्रेशन सफल! डैशबोर्ड पर रीडायरेक्ट हो रहा है...';

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }
    </script>
</body>
</html>
